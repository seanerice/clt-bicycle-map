# Reverse proxy + TLS termination for api.bikemap.seanerice.dev -> the
# compose-internal `api` service (docker-compose.yml, port 8080).
#
# Cloudflare already terminates edge TLS for the domain and proxies to
# this box with SSL mode "Full (strict)" (see
# docs/planning/deployment.md §3), so nginx here terminates the
# Cloudflare-to-origin leg using a Cloudflare Origin CA certificate.
#
# The cert/key mounted at /etc/nginx/certs (see docker-compose.prod.yml)
# are, for this story (8.3), a LOCALLY-GENERATED SELF-SIGNED stand-in —
# see nginx/generate-dev-cert.sh and nginx/README.md. The real Origin CA
# cert is issued by hand in story 8.7 and dropped into the same mount
# path; nothing in this config needs to change for that swap.

server {
    listen 80;
    server_name api.bikemap.seanerice.dev;

    # Plain HTTP -> HTTPS redirect. In prod Cloudflare talks to this box
    # over HTTPS (Full-strict), so this mostly matters for anyone hitting
    # port 80 directly (e.g. a health check or a stray request).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.bikemap.seanerice.dev;

    ssl_certificate     /etc/nginx/certs/api.bikemap.seanerice.dev.crt;
    ssl_certificate_key /etc/nginx/certs/api.bikemap.seanerice.dev.key;

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
