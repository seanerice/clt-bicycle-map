name: Preprocess OSM Data

# Story 4.3 (docs/planning/stories.md): the daily OSM refresh no longer
# runs here. It runs on the EC2 box via the `bikemap-ingest` systemd
# timer (infra/backend/systemd/, installed by
# infra/backend/user-data.sh), which does
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm ingest --all
# There is no `schedule:` trigger and no `aws s3 sync` step anymore — the
# API reads the `features` table live, there is no static file to publish.
#
# What's left here is PR regression coverage: run the real
# `scripts/pipeline` package (fetch -> transform -> UPSERT) against an
# ephemeral CI PostGIS so a change that breaks the pipeline end to end
# fails the PR.
on:
  pull_request:
    branches:
      - "v2"
  workflow_dispatch:

jobs:
  smoke-test:
    name: Pipeline smoke test (fetch -> transform -> UPSERT)
    runs-on: ubuntu-latest
    env:
      # Throwaway CI-only value, same as .github/workflows/deploy.yml's
      # test jobs. scripts/pipeline/ingest.py's connection_kwargs() reads
      # POSTGRES_PASSWORD; host/port/db/user default to
      # localhost/5432/bikemap/bikemap, which matches the `db` service.
      POSTGRES_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dotnet-ef
        # Needed to apply the `features` schema migrations below — mirrors
        # deploy.yml's test-scripts job.
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Start PostGIS
        # Docker is preinstalled on ubuntu-latest runners. `--wait` blocks
        # until the db healthcheck passes so the migration step below can't
        # race Postgres still initialising.
        run: docker compose up -d --wait db

      - name: Apply migrations
        working-directory: db/Migrations
        run: dotnet ef database update

      - name: Run pipeline smoke test (one small area)
        # One area, not `--all`: the public Overpass instance rate-limits
        # sequential queries. The nightly on-box timer runs `--all`
        # off-peak and rides overpass.py's retry/backoff loop through the
        # 429s; a PR check instead wants a fast, low-flake signal that
        # fetch -> transform -> UPSERT still works end to end. `--all` on
        # every PR would make red builds from rate-limiting routine.
        run: python -m scripts.pipeline --area mcadenville
